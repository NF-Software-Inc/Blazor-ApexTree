name: Publish to NuGet (Trusted Publishing)

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: nuget-publishing

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Extract version from tag
        id: get_version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
            echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
            echo "Publishing version from tag: $VERSION"
          else
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
            VERSION=${LATEST_TAG#v}
            echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
            echo "Publishing version from latest tag: $VERSION (tag: $LATEST_TAG)"
          fi

      - name: Restore dependencies
        run: dotnet restore Blazor-ApexTree/Blazor-ApexTree.csproj

      - name: Build
        run: |
          dotnet build Blazor-ApexTree/Blazor-ApexTree.csproj \
            --configuration Release \
            --no-restore \
            /p:Version=${{ steps.get_version.outputs.VERSION }}

      - name: Pack
        run: |
          dotnet pack Blazor-ApexTree/Blazor-ApexTree.csproj \
            --configuration Release \
            --no-build \
            --output ./artifacts \
            /p:Version=${{ steps.get_version.outputs.VERSION }}

      - name: Publish to NuGet (Trusted Publishing)
        run: |
          dotnet nuget push ./artifacts/*.nupkg \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: ./artifacts/*.nupkg
          retention-days: 30
